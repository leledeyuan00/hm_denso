controller_manager:
  ros__parameters:
    update_rate: 500  # Hz For Gazebo

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController
        
    cartesian_compliance_controller:
      type: cartesian_compliance_controller/CartesianComplianceController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    gripper_forward_position_controller:
      type: forward_command_controller/ForwardCommandController
    

forward_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: position


cartesian_compliance_controller:
  ros__parameters:
    ik_solver: "forward_dynamics"
    end_effector_link: "end_link"
    robot_base_link: "robot_base_link"
    ft_sensor_ref_link: "ati_sensor_link"
    compliance_ref_link: "end_link"
    force_enable: true
    gravity_compensation: false
    emergency_stop_threshold: 40.0
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    # Choose: position or velocity.
    command_interfaces:
      - position
        #- velocity

    stiffness:  # w.r.t. compliance_ref_link
        trans_x: 500.0
        trans_y: 500.0
        trans_z: 500.0
        rot_x: 100.0
        rot_y: 100.0
        rot_z: 100.0
    
    damping:
        trans_x: 1.0
        trans_y: 1.0
        trans_z: 1.0
        rot_x: 0.0
        rot_y: 0.0
        rot_z: 0.0

    solver:
        forward_dynamics:
          link_mass: 100.0
        error_scale: 0.5
        iterations: 1
        publish_state_feedback: true

    pd_gains:
        trans_x: {p: 0.1, d: 0.005}
        trans_y: {p: 0.1, d: 0.005}
        trans_z: {p: 0.1, d: 0.005}
        rot_x: {p: 1.0, d: 0.0001}
        rot_y: {p: 1.0, d: 0.0001}
        rot_z: {p: 1.0, d: 0.0001}

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity


gripper_forward_position_controller:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
    interface_name: position
